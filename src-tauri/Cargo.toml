[package]
name = "chainfolio"
version = "0.1.0"
description = "Open-source crypto portfolio intelligence"
authors = ["João Gabriel"]
license = "MIT"
repository = "https://github.com/Raggzinn/chainfolio"
edition = "2024"
rust-version = "1.85"

[lib]
# The `_lib` suffix avoids a name clash between the lib and bin targets on Windows
# (https://github.com/rust-lang/cargo/issues/8519).
name = "chainfolio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# SQLCipher build of SQLite so the database can be encrypted with the master
# password; OpenSSL is vendored so it builds the same on every OS.
rusqlite = { version = "0.39", features = ["bundled-sqlcipher-vendored-openssl"] }
refinery = { version = "0.9", features = ["rusqlite"] }
rust_decimal = { version = "1.43", features = ["serde-with-str"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
bitcoin = "0.32"
bs58 = "0.5"
sha3 = "0.12"
hex = "0.4"
thiserror = "2"
async-trait = "0.1"
futures = "0.3"
tauri-plugin-notification = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"

# OS keychain for BYO API keys, one native backend per platform.
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
