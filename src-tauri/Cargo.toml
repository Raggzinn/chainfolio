[package]
name = "chainfolio"
version = "0.1.0"
description = "Open-source crypto portfolio intelligence"
authors = ["João Gabriel"]
license = "MIT"
repository = "https://github.com/Raggzinn/chainfolio"
edition = "2024"
rust-version = "1.85"

[lib]
# The `_lib` suffix avoids a name clash between the lib and bin targets on Windows
# (https://github.com/rust-lang/cargo/issues/8519).
name = "chainfolio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.39", features = ["bundled"] }
refinery = { version = "0.9", features = ["rusqlite"] }
rust_decimal = { version = "1.43", features = ["serde-with-str"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
bitcoin = "0.32"
bs58 = "0.5"
sha3 = "0.12"
hex = "0.4"
thiserror = "2"
async-trait = "0.1"
futures = "0.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
